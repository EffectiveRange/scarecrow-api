openapi: 3.1.0
x-stoplight:
  id: uwrhkes2u0iwi
info:
  version: 0.1.0
  title: Common models
  summary: Scarecrow common models
  description: Common models for the Scarecrow system
  contact:
    name: Effective Range
    email: info@effective-range.com
    url: 'https://www.effective-range.com'
  license:
    name: MIT
    url: >-
      https://raw.githubusercontent.com/EffectiveRange/scarecrow-api/refs/heads/main/LICENSE
tags:
  - name: common
    description: Common model
paths: {}
components:
  schemas:
    ErrorCode:
      title: ErrorCode
      x-stoplight:
        id: ug1t94il3tjdw
      enum:
        - unknown
        - unreachable
        - status_expired
        - no_session
        - invalid_argument
        - internal_error
        - local_error
        - invalid_state
      default: unknown
    Error:
      title: Error
      x-stoplight:
        id: 01dewxhc5cwwt
      type: object
      required:
        - code
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          x-stoplight:
            id: lqu171esxd1as
        reason:
          type: string
          x-stoplight:
            id: n9czjx5984kqd
    DeviceMode:
      title: DeviceMode
      x-stoplight:
        id: 5rwo2ag2d1vyv
      enum:
        - manual
        - auto
      default: manual
      type: string
    DeviceEvent:
      title: DeviceEvent
      x-stoplight:
        id: cpc7k6c5k9vno
      enum:
        - buzz
        - bang
      default: buzz
      type: string
    DeviceEventRequest:
      title: EventRequest
      x-stoplight:
        id: 9qcvmnp4z3b75
      type: object
      properties:
        event:
          $ref: '#/components/schemas/DeviceEvent'
          x-stoplight:
            id: qbxkpr7ntnb7v
      required:
        - event
    DeviceModeRequest:
      title: DeviceModeRequest
      x-stoplight:
        id: ykhogb54qjwbi
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/DeviceMode'
          x-stoplight:
            id: ux3swpn8jmr4p
      required:
        - mode
