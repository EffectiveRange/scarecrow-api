    ErrorCode:
      title: ErrorCode
      x-stoplight:
        id: 7yg0ltsrn3gj6
      enum:
        - unknown
        - unreachable
        - status_expired
        - no_session
        - invalid_argument
        - internal_error
        - local_error
        - invalid_state
